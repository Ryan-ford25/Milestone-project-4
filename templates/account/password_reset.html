{% extends "base.html" %}

{% load static %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="container">
    <h2 class="logo-font text-center my-5">Reset Password</h2>
    <p class="text-center">Enter your email address and we'll send you instructions to reset your password.</p>
</div>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <form method="post" action="{% url 'password_reset' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" name="email" class="form-control" id="email" required>
                </div>
                <button type="submit" class="btn custom-btn w-100">Send Reset Instructions</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
